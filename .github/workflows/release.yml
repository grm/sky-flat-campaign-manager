name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid version: $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore / Build / Test
        run: |
          dotnet restore SkyFlatCampaignManager.sln
          dotnet build SkyFlatCampaignManager.sln -c Release --no-restore
          dotnet test tests/SkyFlatCampaignManager.UnitTests/SkyFlatCampaignManager.UnitTests.csproj -c Release --no-build
          dotnet test tests/SkyFlatCampaignManager.IntegrationTests/SkyFlatCampaignManager.IntegrationTests.csproj -c Release --no-build

      - name: Package
        shell: pwsh
        run: ./scripts/package-plugin.ps1 -Configuration Release -Version "${{ steps.ver.outputs.version }}"

      - name: Verify package
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/package/SkyFlatCampaignManager-*.zip | Select-Object -First 1
          ./scripts/verify-package.ps1 -ZipPath $zip.FullName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Sky Flat Campaign Manager v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/package/*.zip
            artifacts/package/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
